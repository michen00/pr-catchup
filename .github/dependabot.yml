---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 1,15 * *' # 1st and 15th monthly at midnight UTC
    groups:
      actions:
        patterns: ['*']
    cooldown:
      # GitHub rejects the semver-* keys for this ecosystem, and an invalid key drops
      # the whole entry.
      default-days: 30
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      uv-major:
        update-types: [major]
      uv-minor-patch:
        update-types: [minor, patch]
    cooldown:
      semver-major-days: 30
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ['*']
    cooldown:
      default-days: 7
